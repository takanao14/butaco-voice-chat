<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>会話モード試作</title>
    <link rel="stylesheet" href="/styles.css?v=0.1.6" />
    <style>
      .probe button { display: block; width: 100%; min-height: 3rem; margin: .5rem 0; border: 0; border-radius: .8rem; background: #b34756; color: #fff; font: inherit; font-weight: 700; }
      .probe button.secondary { background: #8a766e; }
      .probe button:disabled { background: #c7b6b0; }
      .probe .row { display: flex; gap: .5rem; }
      .probe .row button { flex: 1; min-height: 2.6rem; font-size: .85rem; }
      .probe h2 { margin: 0 0 .5rem; font-size: 1.05rem; }
      .probe p { margin: .3rem 0 .6rem; line-height: 1.6; font-size: .9rem; }
      .probe .card + .card { margin-top: 1rem; }
      #log { white-space: pre-wrap; font: .75rem/1.5 ui-monospace, monospace; max-height: 20rem; overflow: auto; background: #f7eee8; padding: .6rem; border-radius: .6rem; }
    </style>
    <script type="module" src="/probe.js?v=0.1.6"></script>
  </head>
  <body>
    <main class="shell probe">
      <header class="header">
        <div>
          <p class="eyebrow">会話モード試作</p>
          <h1>iPhone の挙動確認</h1>
        </div>
      </header>

      <section class="card">
        <h2>1. 再生の音の出どころ</h2>
        <p>それぞれ押して、音がどこからどの大きさで聞こえたかを下のボタンで記録してください。</p>
        <button id="play-closed">1a. マイクを使わずに再生</button>
        <button id="play-open">1b. マイクを開いたまま再生</button>
        <button id="play-reopened">1c. マイクを開いて閉じてから再生</button>
        <div class="row">
          <button class="secondary" data-note="スピーカー・普通の音量">スピーカー・普通</button>
          <button class="secondary" data-note="スピーカー・小さい">スピーカー・小さい</button>
          <button class="secondary" data-note="受話口から聞こえた">受話口</button>
        </div>
      </section>

      <section class="card">
        <h2>2. マイク許可の再確認</h2>
        <p>マイクを 3 回開き直します。許可の確認が出たかを記録してください。</p>
        <button id="permission">2. マイクを 3 回開き直す</button>
        <div class="row">
          <button class="secondary" data-note="許可の確認は最初だけ（または出なかった）">確認は出なかった</button>
          <button class="secondary" data-note="開き直すたびに許可の確認が出た">毎回出た</button>
        </div>
      </section>

      <section class="card">
        <h2>3. 会話の繰り返し</h2>
        <p>1 回押すと、録音 2 秒 → 待ち 2 秒 → 再生 を 3 回、ボタンに触れずに繰り返します。再生中は静かにしてください。</p>
        <button id="loop-reopen">3a. 毎回マイクを開き直す</button>
        <button id="loop-open">3b. マイクを開いたまま</button>
      </section>

      <section class="card">
        <h2>4. 画面ロックとアプリ切り替え</h2>
        <p>開始後、画面を 5 秒ほどロックして戻る、または別のアプリに切り替えて戻ってから「終了」を押してください。</p>
        <button id="lock-start">4. 画面を点けたまま録音を始める</button>
        <button id="lock-stop" class="secondary" disabled>終了</button>
      </section>

      <section class="card">
        <h2>記録</h2>
        <button id="copy" class="secondary">記録をコピー</button>
        <div id="log"></div>
      </section>
    </main>
  </body>
</html>
